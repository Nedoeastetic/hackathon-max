<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аварийный диспетчер МКД</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">🏠</div>
      <div class="header-content">
        <h1>Аварийный диспетчер</h1>
        <p>MAX • Умный город</p>
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="create">Создать заявку</button>
      <button class="tab" data-tab="list">Мои заявки</button>
    </div>

    <!-- Create Incident Tab -->
    <div id="create-tab" class="tab-content active">
      <form id="incident-form" class="form">
        <div class="form-group">
          <label for="text">Опишите проблему</label>
          <textarea 
            id="text" 
            name="text" 
            placeholder="Например: Течёт труба в подвале..."
            rows="4"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="photo">Фото (необязательно)</label>
          <input 
            type="file" 
            id="photo" 
            name="photo" 
            accept="image/*"
          >
          <div id="photo-preview" class="photo-preview"></div>
        </div>

        <button type="submit" class="btn btn-primary">
          <span class="btn-text">Отправить заявку</span>
          <span class="btn-loader" style="display: none;">Отправка...</span>
        </button>
      </form>

      <!-- Simulate MAX button (for local dev) -->
      <button id="simulate-max" class="btn btn-secondary">
        🎭 Симулировать MAX initData
      </button>
    </div>

    <!-- Incidents List Tab -->
    <div id="list-tab" class="tab-content">
      <div id="incidents-list" class="incidents-list">
        <div class="loading">Загрузка заявок...</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
